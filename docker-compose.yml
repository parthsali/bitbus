services:
  postgres:
    image: postgres:17-alpine
    container_name: bitbus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitbus
      POSTGRES_PASSWORD: bitbus
      POSTGRES_DB: bitbus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitbus -d bitbus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
