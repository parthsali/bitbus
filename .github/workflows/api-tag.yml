name: "API: Tag, Build & Deploy"

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "docker/api/**"

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  tag-and-push:
    name: Patch tag + Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.next }}
      image: ghcr.io/${{ github.repository_owner }}/bitbus-api:${{ steps.ver.outputs.next }}

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next patch version
        id: ver
        run: |
          git fetch --tags
          LATEST=$(git tag -l "api/v*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="0.1.0"
          else
            V="${LATEST#api/v}"
            MAJ=$(echo "$V" | cut -d. -f1)
            MIN=$(echo "$V" | cut -d. -f2)
            PAT=$(echo "$V" | cut -d. -f3)
            NEXT="${MAJ}.${MIN}.$((PAT + 1))"
          fi
          echo "next=${NEXT}"                        >> "$GITHUB_OUTPUT"
          echo "minor=$(echo $NEXT | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${LATEST:-none} → api/v${NEXT}"

      - name: Push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "api/v${{ steps.ver.outputs.next }}"
          git push origin "api/v${{ steps.ver.outputs.next }}"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/bitbus-api:${{ steps.ver.outputs.next }}
            ghcr.io/${{ github.repository_owner }}/bitbus-api:${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/bitbus-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### API patch — v${{ steps.ver.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag   | \`api/v${{ steps.ver.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`ghcr.io/${{ github.repository_owner }}/bitbus-api:${{ steps.ver.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: tag-and-push

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: bitbus-api
          region: us-central1
          image: ${{ needs.tag-and-push.outputs.image }}
          env_vars: |
            PORT=8080
            ENVIRONMENT=production
            FRONTEND_URL=https://app.bitbus.tech
            GOOGLE_REDIRECT_URL=https://api.bitbus.tech/auth/google/callback
            DATABASE_URL=${{ secrets.BITBUS_DATABASE_URL }}
            JWT_SECRET=${{ secrets.BITBUS_JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.BITBUS_GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.BITBUS_GOOGLE_CLIENT_SECRET }}
          flags: |
            --port=8080
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=128Mi
            --cpu=1
            --cpu-throttling
            --timeout=3600

      - name: Summary
        run: |
          echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.tag-and-push.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`bitbus-api\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region  | \`us-central1\` |" >> "$GITHUB_STEP_SUMMARY"
