name: "API: Build & Deploy"

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "docker/api/**"

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build + push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/bitbus-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: bitbus-api
          region: us-central1
          image: ghcr.io/${{ github.repository_owner }}/bitbus-api:latest
          env_vars: |
            ENVIRONMENT=production
            FRONTEND_URL=https://app.bitbus.tech
            GOOGLE_REDIRECT_URL=https://api.bitbus.tech/auth/google/callback
            DATABASE_URL=${{ secrets.BITBUS_DATABASE_URL }}
            JWT_SECRET=${{ secrets.BITBUS_JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.BITBUS_GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.BITBUS_GOOGLE_CLIENT_SECRET }}
          flags: |
            --port=8080
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=128Mi
            --cpu=1
            --cpu-throttling
            --timeout=3600
